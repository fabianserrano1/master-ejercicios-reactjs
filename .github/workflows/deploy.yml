name: Publicar proyectos React en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ejercicio-1/package-lock.json
            proyecto-final/package-lock.json

      - name: Instalar dependencias del ejercicio
        working-directory: ejercicio-1
        run: npm ci

      - name: Construir ejercicio
        working-directory: ejercicio-1
        run: npm run build

      - name: Instalar dependencias del proyecto final
        working-directory: proyecto-final
        run: npm ci

      - name: Construir proyecto final
        working-directory: proyecto-final
        run: npm run build

      - name: Preparar archivos para publicar
        run: |
          mkdir -p public/ejercicio-1 public/proyecto-final
          cp index.html style.css landing.js public/
          cp -r ejercicio-1/dist/. public/ejercicio-1/
          cp -r proyecto-final/dist/. public/proyecto-final/

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos de publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
